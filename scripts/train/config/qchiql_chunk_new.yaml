defaults:
  - launcher: local
  - _self_

output_model_name: qchiql_chunk_new
dataset_name: tworoom.h5
subdir: ${hydra:job.id}
agent_name: qchiql_chunk_new

trainer:
  max_epochs: 10
  strategy: auto
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0

batch_size: 192
num_workers: ${cpus_per_task}
train_split: 0.9
train_subset_fraction: 1.0
seed: 42

image_size: 224
patch_size: 14
encoder: vit_tiny

# One dataset step contains a complete k=5 action chunk.
frameskip: 5
dinowm:
  history_size: 3
  td_offset: 1
  use_proprio_encoder: false
  action_dim: 2

n_steps: ${eval:'${dinowm.history_size} + ${dinowm.td_offset}'}
# Match OGBench HIQL: subgoal_steps is measured in atomic environment steps.
# Internally Stable-WM advances subgoal_steps / frameskip dataset transitions.
subgoal_steps: 10
rep_dim: 10

# OGBench HIQL network names and defaults.
actor_hidden_dims: [512, 512, 512]
value_hidden_dims: [512, 512, 512]
layer_norm: true
const_std: true
discrete: false

lr: 3e-4

# OGBench HIQL/GCIQL target update and HiQC loss hyperparameters.
tau: 0.005
discount: 0.99
expectile: 0.5
# Match Stable-WM GCIQL/GCHIQL: AWR weights are exp(alpha * advantage).
# The original HiQC Eq. 8 uses flow matching; this variant uses Gaussian AWR.
low_alpha: 3.0
high_alpha: 3.0
low_actor_rep_grad: true
gc_negative: true

# OGBench HIQL goal-sampling names and defaults.
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false

checkpoint_interval: 3
